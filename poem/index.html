<html>
        <head>
            <!-- this is a comment! -->
             <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&display=swap" rel="stylesheet">
            <title>poem downloads</title>
            <link rel="stylesheet" href="style.css">
        </head>
        <body>
         <!-- the body contains all the content-->
        <h1 class= "cabin-sketch-bold">The Bottoms of My <span class="pink">Shoes</span></h1>

        <h2> by Jack Kerouac</h2>
        <img src="images/walking01.jpg"
        alt="repeating shoes walking" class="fadetop">
        <p class="cabin-sketch-regular">The bottoms of my shoes</p>
        <img src="images/walking02.jpg"
        alt="repeating shoes walking" class="fademiddle">
        <p class="indent cabin-sketch-regular">are clean</p>
        <img src="images/walking03.jpg"
        alt="repeating shoes walking" class="fadelast">
        <p class="indent-more cabin-sketch-regular">from walking in the rain</p>
        <img src="images/walking04.jpg"
        alt="repeating shoes walking">
        <h6> Photo by Eadweard Muybridge, 1887</h6>

        </body>
